experiment: rq1_customcnn_d5
rq: rq1
seed: 42

data:
  root: null
  splits_version: v1
  image_size: 224
  batch_size: 64
  num_workers: 2
  augmentation: false
  class_weighting: false

model:
  name: custom_cnn
  num_classes: 5
  channels: [32, 64, 128, 256]
  convs_per_stage: [1, 2, 2, 2]
  dropout: 0.3
  residual: false

training:
  epochs: 30
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.001
  scheduler: cosine
  early_stopping_patience: 7
  monitor: val_macro_f1
  amp: true
  evaluate_test: false
