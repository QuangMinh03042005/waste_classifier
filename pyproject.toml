[project]
name = "waste-classifier"
version = "0.1.0"
description = "Phân loại rác thải bằng CNN trên RealWaste và TrashNet"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "torchvision==0.29.2",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "pillow==13.0.0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "tqdm==4.70.1",
  "streamlit==1.67.0",
  "jupyter==1.1.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "experiments", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
