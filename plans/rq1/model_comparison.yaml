schema_version: "1.0"
plan_id: rq1_model_comparison
rq: rq1
title: "So sánh Custom CNN, MobileNetV3_small scratch và pretrained"
author: "Đinh Quang Minh"
created_at: "2026-11-13"
status: active

question: >-
  Transfer learning với MobileNetV3_small có cải thiện Macro-F1 so với Custom CNN
  huấn luyện từ đầu trên cùng split dữ liệu không; phần cải thiện đến từ kiến trúc
  hay từ pretrained weights?
hypothesis: >-
  MobileNetV3_small pretrained đạt Macro-F1 cao hơn Custom CNN ít nhất 0.02 và cao
  hơn MobileNetV3_small from scratch; khoảng cách với scratch lớn hơn khoảng cách
  giữa scratch và Custom CNN.
expected_result: >-
  Pretrained > scratch > Custom CNN. Chênh lệch rõ nhất ở Glass và Paper, nơi đặc
  trưng texture quan trọng và pretrained features có lợi.
failure_plan: >-
  Nếu pretrained không cải thiện, hoặc scratch ≈ pretrained, báo cáo trung thực và
  phân tích nguyên nhân (domain shift, kích thước dữ liệu, overfitting). Không đổi
  tiêu chí hoặc chọn seed sau khi xem test.

baseline:
  experiment: rq1_customcnn
  description: "Custom CNN huấn luyện từ đầu: channels 32-64-128-256, convs/stage 1-2-2-2, dropout 0.3 (cấu hình chốt sau debug validation-only)."

variants:
  - experiment: rq1_mobilenetv3s_full
    change: "Thay Custom CNN bằng MobileNetV3_small pretrained ImageNet."
    fixed:
      - "split v1, stratified theo (dataset, class), chống trùng bằng pHash"
      - "input 224x224, normalize mean/std ImageNet"
      - "không augmentation, không class weighting"
      - "budget epoch giống Custom CNN (30 hoặc 50 theo kết quả debug)"
      - "AdamW, batch 64, early stopping patience 7"
      - "seed 42, 123, 2024, 7, 3407"
  - experiment: rq1_mobilenetv3s_scratch
    change: "MobileNetV3_small from scratch để tách ảnh hưởng của kiến trúc khỏi pretrained weights."
    fixed:
      - "split v1, input 224x224, không augmentation, không class weighting"
      - "không freeze, dropout 0.2, AdamW LR 1e-3, batch 64"
      - "budget epoch giống Custom CNN (30 hoặc 50)"
      - "seed 42, 123, 2024, 7, 3407"

comparison:
  metric: macro_f1
  secondary: [accuracy, balanced_accuracy, per_class_f1, params, latency]
  test_policy: "Chọn epoch theo val Macro-F1; test chỉ đánh giá một lần sau khi khóa cấu hình."
  success_criterion: >-
    Pretrained cao hơn Custom CNN >= 0.02 và cao hơn ở >= 4/5 seed. So sánh thêm với
    scratch để kết luận phần đóng góp của kiến trúc và pretrained weights.

data:
  train_datasets: [realwaste, trashnet]
  test_dataset: "held-out của từng nguồn"
  splits_version: v1
  class_names: [cardboard, glass, metal, paper, plastic]

seeds: [42, 123, 2024, 7, 3407]

budget:
  max_epochs: 50
  batch_size: 64
  estimated_minutes_per_run: 20

risks: "MobileNet scratch có thể cần nhiều epoch hơn pretrained; cần cùng budget và early stopping."
notes: "Scratch arm là ablation để giải thích vì sao Custom CNN thua, không thay thế câu hỏi chính. Ngưỡng 0.02 tương đương khoảng 16 ảnh đúng trên test 823 ảnh. Kết quả final Custom=0.8870, pretrained=0.8901; scratch cũ fail do LR scale, đang sửa."
