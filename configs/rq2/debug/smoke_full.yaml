experiment: rq2_mobilenetv3s_full
rq: rq2
seed: 42

data:
  root: null
  splits_version: v1
  image_size: 224
  batch_size: 64
  num_workers: 2
  augmentation: true
  class_weighting: true

model:
  name: mobilenet_v3_small
  num_classes: 5
  pretrained: true
  dropout: 0.2
  freeze_epochs: 0
  unfreeze_blocks: 2

training:
  epochs: 1
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 20
  monitor: val_macro_f1
  amp: true
  evaluate_test: false

