schema_version: "1.0"
plan_id: rq2_augmentation_class_weighting
rq: rq2
title: "Ablation Data Augmentation và Class Weighting"
author: "Dương Tấn Cường"
created_at: "2026-11-13"
status: active

question: >-
  Data Augmentation và Class Weighting đóng góp bao nhiêu vào Macro-F1 của
  MobileNetV3_small trên bài toán 5 lớp?
hypothesis: >-
  Full model (augmentation + class weighting) đạt Macro-F1 cao hơn từng ablation;
  class weighting cải thiện recall của lớp thiểu số (Glass, Cardboard).
expected_result: >-
  Full cao hơn no-augmentation rõ rệt về Macro-F1; class weighting tăng recall lớp
  thiểu số nhưng có thể giảm nhẹ accuracy toàn cục.
failure_plan: >-
  Nếu ablation không cải thiện, ghi nhận và phân tích theo lớp cùng đường cong
  train/validation. Không chọn biến thể dựa trên test set.

baseline:
  experiment: rq2_mobilenetv3s_full
  description: >-
    MobileNetV3_small pretrained ImageNet, full fine-tune + augmentation đầy đủ
    (RandomResizedCrop 224 scale 0.7-1.0, RandomHorizontalFlip p=0.5,
    RandomRotation 15 độ, ColorJitter 0.2, RandomErasing p=0.1) + class weighting
    (w_c = N/(K*n_c), clip [0.5, 3.0]); 30 epoch, batch 64, AdamW lr 1e-3,
    weight decay 1e-4, cosine, early stopping patience 7; seed 42, 123, 2024.

variants:
  - experiment: rq2_mobilenetv3s_noaug
    change: >-
      Bỏ Data Augmentation (train transform chỉ còn Resize 256 + CenterCrop 224),
      giữ nguyên class weighting.
    fixed:
      - "split v1, MobileNetV3_small pretrained ImageNet, full fine-tune, dropout 0.2"
      - "class weighting w_c = N/(K*n_c), clip [0.5, 3.0]; weight trên train v1: cardboard 1.271, glass 1.189, metal 0.914, paper 1.001, plastic 0.782 (clip không kích hoạt)"
      - "input 224x224, chuẩn hóa mean/std ImageNet"
      - "30 epoch cho baseline và mọi biến thể, batch 64, AdamW lr 1e-3, weight decay 1e-4, cosine, early stopping patience 7 theo val Macro-F1"
      - "seed 42, 123, 2024"
  - experiment: rq2_mobilenetv3s_nocw
    change: >-
      Bỏ Class Weighting (CrossEntropyLoss không trọng số), giữ nguyên Data
      Augmentation.
    fixed:
      - "split v1, MobileNetV3_small pretrained ImageNet, full fine-tune, dropout 0.2"
      - "augmentation: RandomResizedCrop 224 scale 0.7-1.0, RandomHorizontalFlip p=0.5, RandomRotation 15 độ, ColorJitter 0.2, RandomErasing p=0.1"
      - "input 224x224, chuẩn hóa mean/std ImageNet"
      - "30 epoch cho baseline và mọi biến thể, batch 64, AdamW lr 1e-3, weight decay 1e-4, cosine, early stopping patience 7 theo val Macro-F1"
      - "seed 42, 123, 2024"

comparison:
  metric: macro_f1
  secondary: [accuracy, balanced_accuracy, per_class_recall]
  test_policy: >-
    Chọn epoch theo val Macro-F1; test chỉ đánh giá một lần cho mỗi run
    (mỗi biến thể x seed) và không dùng test để chọn epoch hay cấu hình.
  success_criterion: "Full cao hơn mỗi ablation >= 0.01 Macro-F1 (trung bình 3 seed)."

data:
  train_datasets: [realwaste, trashnet]
  test_dataset: "held-out của từng nguồn"
  splits_version: v1
  class_names: [cardboard, glass, metal, paper, plastic]

seeds: [42, 123, 2024]

budget:
  applies_to: "baseline và cả hai biến thể"
  max_epochs: 30
  batch_size: 64
  early_stopping_patience: 7
  estimated_minutes_per_run: 30

risks: "Class weighting có thể làm tăng false positive ở lớp đa số."
notes: >-
  Báo cáo per-class recall cho từng biến thể để thấy tác động lên lớp thiểu số. Mất cân bằng lớp trên
  train v1 chỉ 1.63 (plastic 980 so với cardboard 603) nên class weight nằm trong
  [0.78, 1.27] và clip [0.5, 3.0] không kích hoạt; kỳ vọng tác động của class
  weighting là nhỏ và phải đánh giá kèm per-seed, không chỉ mean. Augmentation dùng
  đúng 5 phép của src/data/transforms.py, gồm RandomErasing p=0.1. RQ1 final dùng
  50 epoch nên so sánh RQ2 với RQ1 chỉ mang tính định tính, không phải so sánh có
  kiểm soát.
