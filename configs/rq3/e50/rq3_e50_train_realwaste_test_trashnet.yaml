experiment: rq3_e50_train_realwaste_test_trashnet
rq: rq3
seed: 42
data:
  root: null
  split_csv: data/splits/rq3/rw_to_tn.csv
  image_size: 224
  batch_size: 64
  num_workers: 2
  augmentation: false
  class_weighting: false
model:
  name: mobilenet_v3_small
  num_classes: 5
  pretrained: true
  dropout: 0.2
  freeze_epochs: 0
  unfreeze_blocks: 2
training:
  epochs: 50
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 7
  monitor: val_macro_f1
  amp: true
  evaluate_test: true
