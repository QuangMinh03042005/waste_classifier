schema_version: "1.0"
plan_id: rq1_scratch_fix
rq: rq1
title: "Sửa recipe huấn luyện MobileNetV3_small scratch (validation-only)"
author: "Đinh Quang Minh"
created_at: "2026-11-20"
status: active

question: >-
  Recipe nào giúp MobileNetV3_small from scratch hội tụ ổn định trên split v1,
  sau khi sửa lỗi backbone learning rate bị scale như fine-tuning?
hypothesis: >-
  Với backbone_lr_scale = 1.0 và warmup 3 epoch, scratch sẽ học được đặc trưng
  thay vì chỉ head memorize; LR 3e-4 ổn định hơn 1e-3.
expected_result: >-
  Cả S1 và S2 đều vượt mức random; S2 có val Macro-F1 cao hơn hoặc ổn định hơn.
failure_plan: >-
  Nếu cả hai vẫn gần random, kiểm tra lại gradient/BN và ghi nhận scratch không
  hội tụ với recipe không augmentation. Không dùng test để chọn recipe.

baseline:
  experiment: rq1_scratch_s1
  description: "Scratch, backbone_lr_scale=1.0, LR 1e-3, warmup 3 epoch."

variants:
  - experiment: rq1_scratch_s2
    change: "Giảm LR xuống 3e-4, giữ backbone_lr_scale=1.0 và warmup 3 epoch."
    fixed:
      - "split v1, input 224x224, không augmentation, không class weighting"
      - "MobileNetV3_small scratch, dropout 0.2, AdamW, batch 64"
      - "50 epoch, early stopping patience 7, seed 42 cho screening"
      - "top-2 chạy thêm seed 123, 2024; final 5 seed nếu được chọn"
  - experiment: rq1_scratch_s3
    change: "Tăng weight decay lên 1e-3 so với S1."
    fixed:
      - "split v1, input 224x224, không augmentation, không class weighting"
      - "MobileNetV3_small scratch, dropout 0.2, LR 1e-3, warmup 3 epoch"
      - "backbone_lr_scale=1.0, batch 64, 50 epoch, seed 42"
  - experiment: rq1_scratch_s4
    change: "Tăng dropout lên 0.3 so với S1."
    fixed:
      - "split v1, input 224x224, không augmentation, không class weighting"
      - "MobileNetV3_small scratch, LR 1e-3, warmup 3 epoch"
      - "backbone_lr_scale=1.0, weight_decay=1e-4, batch 64, 50 epoch, seed 42"

comparison:
  metric: val_macro_f1
  secondary: [val_loss, train_val_gap, duration_sec]
  test_policy: "Không đánh giá test trong screening; recipe chốt trên validation."
  success_criterion: >-
    Chọn recipe có val Macro-F1 cao nhất và không gần random; nếu chênh < 0.005,
    chọn recipe ổn định hơn theo learning curves.

data:
  train_datasets: [realwaste, trashnet]
  test_dataset: "không sử dụng trong screening"
  splits_version: v1
  class_names: [cardboard, glass, metal, paper, plastic]

seeds: [42, 123, 2024, 7, 3407]

budget:
  max_epochs: 50
  batch_size: 64
  estimated_minutes_per_run: 12

risks: "Scratch vẫn có thể overfit vì RQ1 không dùng augmentation."
notes: >-
  Đây là correction của scratch arm. S1 val 0.7039 nhưng overfit mạnh; S2 gần random.
  Thêm S3/S4 để giảm overfit. Các run scratch cũ bị lỗi optimizer LR và không dùng
  trong kết luận. Test reuse sẽ được công bố trong báo cáo.
